services:
  postgres:
    image: postgres:16
    container_name: vetcare-postgres
    environment:
      POSTGRES_DB: vetcare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["vetcare_data:/var/lib/postgresql/data"]
  backend:
    build: .
    depends_on: [postgres]
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/vetcare
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports: ["8080:8080"]
volumes:
  vetcare_data:
